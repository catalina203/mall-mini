spring:
  application:
    name: mall-mini-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mall_mini?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:mallmini}
    password: ${DB_PASSWORD:mallmini_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      update-strategy: not_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-bytes-long}
    expire-minutes: ${JWT_EXPIRE_MINUTES:1440}
  dev-login-enabled: ${APP_DEV_LOGIN_ENABLED:false}
  payment:
    mock-enabled: ${APP_PAYMENT_MOCK_ENABLED:false}
  shipping:
    fee: ${APP_SHIPPING_FEE:10.00}
    free-threshold: ${APP_FREE_SHIPPING_THRESHOLD:99.00}
  order:
    cancel-minutes: ${APP_ORDER_CANCEL_MINUTES:30}
    auto-cancel-enabled: ${APP_AUTO_CANCEL_ENABLED:true}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./uploads}
  admin-init:
    username: ${APP_ADMIN_INIT_USERNAME:admin}
    password: ${APP_ADMIN_INIT_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}

logging:
  level:
    root: INFO
    com.mallmini: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
