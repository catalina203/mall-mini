services:
  mysql:
    image: mysql:8.0
    container_name: mall-mini-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mall_mini}
      MYSQL_USER: ${MYSQL_USER:-mallmini}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mallmini_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mall-mini-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mall-mini-mysql-data:
